<!doctype html>
<html lang="en" class="gated">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Climb · scene 1</title>
<meta name="theme-color" content="#1a1228">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--fg:#f6e9e2;--mut:#cdb3b4;--acc:#ffb38a;--sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#1a1228;color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
html.gated,html.gated body{overflow:hidden}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0}
#space{height:1240vh}
.hud{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px clamp(16px,3vw,40px);pointer-events:none;background:linear-gradient(180deg,rgba(14,12,30,.55),rgba(14,12,30,0))}
.hud .mark{font:500 28px/1 var(--sans);letter-spacing:-.04em;color:#fff4ea}
.hud .mark small{display:block;font:500 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.btns{display:flex;gap:10px;pointer-events:auto}
#sndbtn,#playbtn{pointer-events:auto;font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);background:rgba(14,12,30,.45);border:1px solid rgba(246,233,226,.28);border-radius:999px;padding:9px 16px;cursor:pointer}
#sndbtn[aria-pressed="true"],#playbtn[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
#playbtn::before{content:"\25B6\00a0\00a0"}#playbtn[aria-pressed="true"]::before{content:"\275A\275A\00a0\00a0"}
#barwrap{position:fixed;left:0;right:0;top:0;height:2px;z-index:25}#bar{height:100%;background:var(--acc);transform:scaleX(0);transform-origin:left}
#cap{position:fixed;z-index:10;right:clamp(20px,5vw,84px);bottom:clamp(40px,11vh,120px);max-width:min(520px,calc(100vw - 40px));opacity:0;transform:translateY(16px);transition:opacity .8s,transform .8s;pointer-events:none;text-shadow:0 2px 24px rgba(10,8,22,.75)}
#cap.in{opacity:1;transform:none}
#cap.dark::before{opacity:0}#cap.dark h2{color:#34203c}#cap.dark .lede{color:#4a3352}#cap.dark .eb{color:#9a3c2a}#cap.dark{text-shadow:0 1px 18px rgba(255,236,236,.55)}
#cap,#cap h2,#cap .lede,#cap .eb{transition:opacity .8s,transform .8s,color .6s}#cap::before{transition:opacity .6s}
#cap .eb{font:500 11.5px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin-bottom:16px}
#cap h2{font-weight:400;font-size:clamp(34px,4.6vw,66px);line-height:1.02;letter-spacing:-.035em;color:#fff6ee}
#cap .lede{margin-top:18px;font-size:clamp(15px,1.4vw,18px);line-height:1.65;font-weight:300;color:#ecd9d4}
.cue{transition:opacity .6s;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:12;font:500 10.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;animation:cue 2.6s ease-in-out infinite}
.cue i{display:block;width:1px;height:34px;background:linear-gradient(var(--acc),transparent)}
@keyframes cue{0%,100%{opacity:.35}50%{opacity:1}}
#entry{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(26,18,40,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:opacity .9s}
#entry.out{opacity:0;pointer-events:none}
.in-box{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:520px}
.in-box .eb{font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.in-box h1{font-weight:400;font-size:clamp(44px,9vw,92px);letter-spacing:-.045em;line-height:1;color:#fff6ee}
.in-box p{color:var(--mut);font-size:15px;line-height:1.6;margin-bottom:12px}
.btn{font:500 15px var(--sans);padding:14px 26px;border-radius:999px;background:var(--acc);color:#2a1410;border:0;cursor:pointer}
.link{background:none;border:0;color:var(--mut);font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;text-decoration:underline;text-underline-offset:5px;cursor:pointer;padding:8px}
#cap::before{content:"";position:absolute;inset:-34px -38px -30px -38px;z-index:-1;background:radial-gradient(closest-side,rgba(14,12,30,.5),rgba(14,12,30,0));pointer-events:none}
@media (max-width:760px){#cap{left:20px;right:20px;top:92px;bottom:auto;max-width:none}#cap::before{background:linear-gradient(180deg,rgba(14,12,30,.62),rgba(14,12,30,0));inset:-92px -20px -34px -20px}.cue{display:none}}
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>
<div id="barwrap" aria-hidden="true"><div id="bar"></div></div>
<header class="hud"><div class="mark">ds.<small id="where">The Climb · scene 1 · base camp</small></div><div class="btns"><button id="playbtn" type="button" aria-pressed="false">Play</button><button id="sndbtn" type="button" aria-pressed="false">Sound off</button></div></header>
<div id="cap" aria-live="polite"><p class="eb"></p><h2></h2><p class="lede"></p></div>
<div class="cue" aria-hidden="true"><span>Scroll to climb</span><i></i></div>
<div id="space"></div>
<div id="entry" role="dialog" aria-modal="true" aria-label="Enter the climb">
  <div class="in-box"><p class="eb">Danilo Silva · AI engineer</p><h1>The Climb</h1><p>A story told by climbing a mountain. Scroll to walk. Headphones recommended: the world, and a song, are made live.</p>
    <button class="btn" id="gate-on" type="button">Begin, with sound</button><button class="link" id="gate-off" type="button">Begin without sound</button><button class="link" id="gate-play" type="button">Play it for me, with sound (it scrolls by itself)</button></div>
</div>
<script src="sound.js?v=20261026e"></script>
<script src="scene.js?v=20261026e"></script>
</body>
</html>
